name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Ganti dengan branch yang kamu gunakan (misalnya main atau master)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # 2. Setup Git config (Menambahkan konfigurasi git untuk commit)
      - name: Set up Git config
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 3. Setup Node.js (optional, jika menggunakan npm atau yarn)
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'  # Sesuaikan dengan versi Node.js yang kamu gunakan

      # 4. Install dependencies (optional, jika menggunakan npm atau yarn)
      # - name: Install dependencies
      #   run: npm install

      # 5. Build project (optional, jika menggunakan framework seperti React, Vue, dll)
      # - name: Build project
      #   run: npm run build

      # 6. Deploy ke GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_TOKEN }}  # Menggunakan PAT dari GitHub Secrets
          publish_dir: ./  # Ganti dengan folder build jika menggunakan framework
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
