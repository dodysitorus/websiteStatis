name: Build, Run Automation and Deploy to GitHub Pages

on:
  push:
    branches:
      - main 

jobs:
  trigger-cucumber-tests:
    runs-on: ubuntu-latest

    steps:
      # Langkah 1: Checkout repository Web Statis
      - name: Checkout Web Statis Repository
        uses: actions/checkout@v3

      # Langkah 2: Trigger workflow di repository "api-automation"
      - name: Trigger Cucumber Automation from api-automation
        uses: peter-evans/repository-dispatch@v3
        with:
          repository: dodysitorus/api-automation
          token: ${{ secrets.GH_TOKEN }} 
          event-type: trigger-cucumber-tests
          client-payload: {} 

  deploy-to-gh-pages:
    runs-on: ubuntu-latest
    # Job ini akan dijalankan hanya setelah job pemicu BERHASIL DIKIRIM
    needs: trigger-cucumber-tests 

    steps:
      # Langkah 3: Checkout repository Web Statis
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      # Langkah 4: Deploy ke GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_TOKEN }} 
          publish_dir: ./ 
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'